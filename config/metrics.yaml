# 대시보드 요약 카드/표 정의 (코드 수정 없이 카드 구성 변경)
summary_cards:
  - key: gross_sales
    label: 매출
    unit: krw
  - key: orders
    label: 주문수
    unit: count
  - key: aov
    label: 객단가
    unit: krw
  - key: visitors
    label: 방문자
    unit: count
    source_note: "GA4 (카페24 Admin API에는 방문자 없음)"
  - key: conversion_rate
    label: 구매전환율
    unit: pct
  - key: ad_cost
    label: 광고비
    unit: krw
  - key: roas
    label: ROAS
    unit: pct

# 목표 (카페24 어드민 탭 '누적 매출 vs 목표 페이스')
targets:
  monthly_sales: 90000000      # 월 매출 목표(원) ← 업체와 합의. 0 이면 목표선 미표시

# 방문자 정의 차이 안내 (카페24 방문 vs GA4 사용자 — 숫자가 다른 게 정상)
visitor_sources:
  primary: ga4
  secondary: cafe24_analytics

# 카테고리 그룹 — 디어마미 카페24 카테고리 트리(2026-11 확인) 기준
# 키 = 대시보드 표시 그룹, 값 = 카페24 카테고리 이름들 (상품이 속한 카테고리의 깊은 단계부터 대조).
# 예) '컬렉션 > 모임/출근룩 > 원피스', '니트 > 원피스', '생활한복 > 원피스' → 모두 '원피스'
# 세일·NEW·BEST 같은 기획 카테고리는 이름이 안 맞으므로 자동 제외. 여러 그룹에 걸치면 많이 걸린 쪽(동률이면 위쪽) 우선.
category_groups:
  원피스: ["원피스", "소매원피스", "민소매원피스", "롱원피스", "투피스"]
  아우터: ["아우터", "자켓/코트", "점퍼", "가디건", "조끼", "저고리", "자켓", "코트"]
  상의: ["상의", "티셔츠", "블라우스/남방", "#니트", "#폴라넥", "#나시/속지", "블라우스", "셔츠"]
  하의: ["하의", "바지", "치마", "팬츠", "스커트", "슬랙스", "데님"]
  ACC/이너웨어: ["ACC", "ACC/이너웨어", "이너웨어", "속옷", "레깅스/이너웨어"]
  남성복: ["남성복", "남성한복"]
  기타: []
