name: ops daily collect (all channels)

# 매일 07:00 KST = 22:00 UTC (전날). 최근 3일 재수집 = 지연 확정 데이터 보정 + 결번 자가치유.
# schedule 은 기본 브랜치(main)에 있을 때만 동작. Secrets 없는 채널은 자동 스킵.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일 (백필 시 14~30)"
        default: "3"
      skip:
        description: "건너뛸 소스 (콤마): cafe24,cafe24_analytics,ga4,ads,competitor"
        default: ""
      reset:
        description: "facts 전체 초기화 후 수집 (demo→live 전환 시 true)"
        default: "false"

concurrency:
  group: ops-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      CAFE24_OPS_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
      CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
      CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
      CAFE24_ACCESS_TOKEN: ${{ secrets.CAFE24_ACCESS_TOKEN }}
      CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      NAVER_SA_API_KEY: ${{ secrets.NAVER_SA_API_KEY }}
      NAVER_SA_SECRET_KEY: ${{ secrets.NAVER_SA_SECRET_KEY }}
      NAVER_SA_CUSTOMER_ID: ${{ secrets.NAVER_SA_CUSTOMER_ID }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
      KAKAO_AD_ACCOUNT_ID: ${{ secrets.KAKAO_AD_ACCOUNT_ID }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_ACCESS_TOKEN: ${{ secrets.GOOGLE_ADS_ACCESS_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: DATABASE_URL 확인
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL Secret 이 없습니다. 러너는 매번 초기화되므로 Neon 등 무료 Postgres 가 필요합니다 (docs/DEPLOY-FREE.md §0)"; exit 1; fi
      - name: 수집
        run: |
          ARGS="--mode live --days ${{ github.event.inputs.days || '3' }} --notify"
          [ -n "${{ github.event.inputs.skip }}" ] && ARGS="$ARGS --skip ${{ github.event.inputs.skip }}"
          [ "${{ github.event.inputs.reset }}" = "true" ] && ARGS="$ARGS --reset"
          python scripts/run_all.py $ARGS
      - name: 브리핑 (Slack 설정 시 전송)
        run: python scripts/notify.py
