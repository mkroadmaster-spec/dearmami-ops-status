name: probe (진단 스크립트)

# 카페24 통계 API 진단: 각 경로의 실제 응답(키·첫 2행) + DB 에 쌓인 지표 합계를 로그에 출력
on:
  workflow_dispatch:
    inputs:
      script:
        description: "scripts/ 안의 진단 스크립트 이름 (analytics_probe, google_probe, kakao_probe)"
        default: "analytics_probe"
      args:
        description: "인자 (예: 날짜 YYYY-MM-DD)"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      CAFE24_OPS_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
      CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
      CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
      CAFE24_ACCESS_TOKEN: ${{ secrets.CAFE24_ACCESS_TOKEN }}
      CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_BUSINESS_SECRET: ${{ secrets.KAKAO_BUSINESS_SECRET }}
      KAKAO_AD_ACCOUNT_ID: ${{ secrets.KAKAO_AD_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python scripts/${{ github.event.inputs.script }}.py ${{ github.event.inputs.args }}
