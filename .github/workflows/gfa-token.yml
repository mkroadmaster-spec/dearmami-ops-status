name: gfa token

# 네이버 GFA 2단계: 네이버 로그인 인증코드 → 액세스/리프레시 토큰 교환 → DB(app_kv) 저장 → 광고계정 목록 + 어제 성과 1회 확인
on:
  workflow_dispatch:
    inputs:
      code:
        description: "승인 후 받은 code (주소 전체를 붙여넣어도 됩니다)"
        required: true

jobs:
  exchange:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GFA_AD_ACCOUNT_NO: ${{ secrets.GFA_AD_ACCOUNT_NO }}
      GFA_MANAGER_ACCOUNT_NO: ${{ secrets.GFA_MANAGER_ACCOUNT_NO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: 교환 + DB 저장 + 성과 1회 확인
        run: |
          python - <<'PY'
          import os, re, sys, urllib.parse
          sys.path.insert(0, ".")
          from cafe24_ops.clients import ads_gfa
          from cafe24_ops.store import Store
          raw = """${{ github.event.inputs.code }}""".strip()
          m = re.search(r"[?&]code=([^&#\s]+)", raw)
          code = urllib.parse.unquote(m.group(1)) if m else raw
          summ = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          try:
              tok = ads_gfa.exchange_code(code)
          except Exception as e:
              summ.write(f"## ❌ GFA(네이버 로그인) 토큰 교환 실패\n\n```\n{e}\n```\n\n- `invalid_request`/`invalid_grant` → 코드가 10분 지났거나 이미 사용됨: `gfa authorize url` 부터 다시\n- `invalid_client`/`unauthorized_client` → Secret `NAVER_CLIENT_ID` / `NAVER_CLIENT_SECRET` 을 개발자센터 앱의 복사 아이콘으로 다시 저장\n- redirect 오류 → 앱 > API 설정 > 네이버 로그인 **Callback URL** 이 대시보드 주소와 글자까지 같은지 확인\n")
              print("::error::" + str(e).replace("\n"," ")[:400]); raise SystemExit(1)
          store = Store(); ads_gfa.save_tokens(store, tok)
          summ.write("## ✅ GFA 토큰 발급 + DB 저장 완료\n\n")
          c = ads_gfa.GfaClient(store)
          try:
              accs = c.ad_accounts()
              summ.write("### 내 광고계정 목록 (Secret GFA_AD_ACCOUNT_NO 와 비교)\n\n" + "\n".join(f"- `{a.get('no') or a.get('adAccountNo') or a.get('id')}` {a.get('name')} ({a.get('role','')})" for a in accs[:20]) + "\n\n")
          except Exception as e:
              print("::warning::광고계정 목록 조회 실패 " + str(e)[:300])
              summ.write(f"⚠ 광고계정 목록 조회 실패: `{e}`\n\n→ **GFA 사이트 > 설정 > API 관리 > API 사용 신청** 이 승인됐는지, 로그인한 네이버 아이디가 광고계정 멤버인지 확인 (FAQ: 승인 전 동의했으면 네이버 '연결된 서비스 관리'에서 철회 후 재승인)\n\n")
          try:
              from datetime import date, timedelta
              d = (date.today() - timedelta(days=1)).isoformat()
              rep = c.daily(d)
              summ.write(f"어제({d}) 성과 확인: 광고비 {rep['ad_cost']:,.0f} · 노출 {rep['impressions']:,.0f} · 클릭 {rep['clicks']:,.0f} · 구매전환 {rep['conversions']:,.0f}\n\n다음: `ops daily collect` 실행 → `ads=ok`\n")
          except Exception as e:
              print("::warning::성과 조회 실패 " + str(e)[:300])
              summ.write(f"⚠ 토큰은 저장됐지만 성과 조회 실패: `{e}`\n\n→ `GFA_AD_ACCOUNT_NO` 숫자(위 목록 참고), 관리계정 멤버만이면 `GFA_MANAGER_ACCOUNT_NO` 추가\n")
          PY
