name: cafe24 weekly report

# 매주 월요일 08:25 KST (= 일 23:25 UTC): 지난주 8일 보정 수집 → 주간 리포트 .docx 아티팩트 업로드 → 9시에는 받아갈 수 있는 상태.
on:
  schedule:
    - cron: "25 23 * * 0"
  workflow_dispatch:
    inputs:
      week:
        description: "리포트 주의 아무 날짜 (YYYY-MM-DD, 비우면 지난주)"
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      CAFE24_OPS_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
      CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
      CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      NAVER_SA_API_KEY: ${{ secrets.NAVER_SA_API_KEY }}
      NAVER_SA_SECRET_KEY: ${{ secrets.NAVER_SA_SECRET_KEY }}
      NAVER_SA_CUSTOMER_ID: ${{ secrets.NAVER_SA_CUSTOMER_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 지난주 8일 보정 수집 (competitor 제외)
        run: python scripts/run_all.py --mode live --days 8 --skip competitor
      - name: 주간 리포트 .docx 생성
        run: python scripts/weekly_report.py ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}
      - name: 텔레그램으로 .docx 전송 (설정 시)
        run: python scripts/notify.py --weekly-docx
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: dist/reports/*.docx
          retention-days: 90
