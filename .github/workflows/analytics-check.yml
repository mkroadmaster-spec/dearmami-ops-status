name: cafe24 analytics check

# 카페24 통계 API 진단: 각 경로의 실제 응답(키·첫 2행) + DB 에 쌓인 지표 합계를 로그에 출력
on:
  workflow_dispatch:
    inputs:
      date:
        description: "확인할 날짜 YYYY-MM-DD (비우면 어제)"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      CAFE24_OPS_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
      CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
      CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
      CAFE24_ACCESS_TOKEN: ${{ secrets.CAFE24_ACCESS_TOKEN }}
      CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python scripts/analytics_probe.py ${{ github.event.inputs.date }}
