name: channel check (ads tokens)

# 광고 채널 진단: DB 토큰 보유 여부(길이만) · 만료시각 · 어제 리포트 1회 호출 결과를 로그와 Summary 에 출력
on:
  workflow_dispatch:
    inputs:
      channels:
        description: "확인할 채널 (콤마): kakao,google,gfa"
        default: "kakao,google"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_BUSINESS_SECRET: ${{ secrets.KAKAO_BUSINESS_SECRET }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_AD_ACCOUNT_ID: ${{ secrets.KAKAO_AD_ACCOUNT_ID }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GFA_AD_ACCOUNT_NO: ${{ secrets.GFA_AD_ACCOUNT_NO }}
      GFA_MANAGER_ACCOUNT_NO: ${{ secrets.GFA_MANAGER_ACCOUNT_NO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: 진단
        run: |
          python - <<'PY'
          import os, re, sys, time, traceback
          sys.path.insert(0, ".")
          from datetime import date, timedelta
          from cafe24_ops.clients import ads_kakao, ads_google, ads_gfa
          from cafe24_ops.store import Store
          store = Store(); d = (date.today() - timedelta(days=1)).isoformat()
          summ = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          def out(s):
              print(s, flush=True); summ.write(s + "\n\n")
          def shape(name):  # 값은 숨기고 형태만 (숫자/하이픈/공백 여부)
              v = os.environ.get(name, "")
              return f"{name}: len={len(v)} digits_only={v.isdigit()} has_hyphen={'-' in v} has_space={bool(re.search(r'\s', v))}"
          MODS = {"kakao": (ads_kakao, lambda: ads_kakao.KakaoMomentClient(store).account_report(d), ["KAKAO_AD_ACCOUNT_ID"]),
                  "google": (ads_google, lambda: ads_google.GoogleAdsClient(store).daily(d), ["GOOGLE_ADS_CUSTOMER_ID", "GOOGLE_ADS_LOGIN_CUSTOMER_ID"]),
                  "gfa": (ads_gfa, lambda: ads_gfa.GfaClient(store).daily(d), ["GFA_AD_ACCOUNT_NO", "GFA_MANAGER_ACCOUNT_NO"])}
          for ch in [c.strip() for c in "${{ github.event.inputs.channels }}".split(",") if c.strip() in MODS]:
              mod, call, ids = MODS[ch]
              out(f"## {ch} — is_configured={mod.is_configured()}")
              for k in (mod.KV_ACCESS, mod.KV_REFRESH, mod.KV_EXPIRES):
                  v = store.kv_get(k)
                  extra = f" (만료까지 {int(v) - int(time.time())}초)" if k == mod.KV_EXPIRES and v.isdigit() else ""
                  out(f"- DB `{k}`: len={len(v)}{extra}")
              for n in ids:
                  out("- " + shape(n))
              try:
                  rep = call()
                  out(f"- ✅ 어제({d}) 리포트: 광고비 {rep['ad_cost']:,.0f} · 노출 {rep['impressions']:,.0f} · 클릭 {rep['clicks']:,.0f} · 전환 {rep['conversions']:,.0f}")
              except Exception as e:
                  msg = re.sub(r"<[^>]+>|\s+", " ", str(e))[:600]
                  out(f"- ❌ {type(e).__name__}: {msg}")
                  traceback.print_exc()
          PY
