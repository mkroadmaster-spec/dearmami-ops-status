name: google token

# 구글 광고 2단계: 인증코드 → 리프레시 토큰 교환 → DB(app_kv) 저장. 이후 수집이 액세스 토큰을 자동 갱신.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "승인 후 받은 code (주소 전체를 붙여넣어도 됩니다)"
        required: true
      redirect_uri:
        description: "authorize 때와 동일"
        required: true
        default: "https://mkroadmaster-spec.github.io/dearmami-ops-status/"

jobs:
  exchange:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: 교환 + DB 저장 + 리포트 1회 확인
        run: |
          python - <<'PY'
          import os, re, sys, urllib.parse
          sys.path.insert(0, ".")
          from cafe24_ops.clients import ads_google
          from cafe24_ops.store import Store
          raw = """${{ github.event.inputs.code }}""".strip()
          m = re.search(r"[?&]code=([^&#\s]+)", raw)
          code = urllib.parse.unquote(m.group(1)) if m else raw
          summ = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          try:
              tok = ads_google.exchange_code(code, "${{ github.event.inputs.redirect_uri }}")
          except Exception as e:
              summ.write(f"## ❌ 구글 토큰 교환 실패\n\n```\n{e}\n```\n\n- `invalid_grant` → 코드가 만료됐거나 이미 사용됨: `google authorize url` 부터 다시\n- `redirect_uri_mismatch` → OAuth 클라이언트의 승인된 리디렉션 URI 가 글자까지 같은지 확인\n- `invalid_client` → Secret `GOOGLE_ADS_CLIENT_ID` / `GOOGLE_ADS_CLIENT_SECRET` 확인\n")
              raise SystemExit(1)
          if not tok.get("refresh_token"):
              summ.write("## ⚠ 리프레시 토큰이 오지 않았습니다\n\n이미 한 번 동의한 계정입니다. https://myaccount.google.com/permissions 에서 '디어마미 대시보드' 접근을 삭제한 뒤 `google authorize url` 부터 다시 하세요.\n")
              raise SystemExit(1)
          store = Store(); ads_google.save_tokens(store, tok)
          summ.write("## ✅ 구글 토큰 발급 + DB 저장 완료\n\n")
          try:
              from datetime import date, timedelta
              d = (date.today() - timedelta(days=1)).isoformat()
              rep = ads_google.GoogleAdsClient(store).daily(d)
              summ.write(f"어제({d}) 리포트 확인: 광고비 {rep['ad_cost']:,.0f} · 노출 {rep['impressions']:,.0f} · 클릭 {rep['clicks']:,.0f}\n\n다음: `ops daily collect` 실행 → `ads=ok`\n")
          except Exception as e:
              summ.write(f"⚠ 토큰은 저장됐지만 리포트 조회 실패: `{e}`\n\n→ 개발자 토큰 **액세스 수준(탐색자 이상)**, `GOOGLE_ADS_CUSTOMER_ID`/`GOOGLE_ADS_LOGIN_CUSTOMER_ID`(하이픈 없이), 로그인 계정의 광고계정 권한을 확인하세요.\n")
          PY
