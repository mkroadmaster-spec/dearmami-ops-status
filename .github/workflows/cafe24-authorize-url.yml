name: cafe24 authorize url

# 카페24 승인 URL 출력 (1단계). 브라우저에서 승인 → code 복사 → 'cafe24 token fast' 에 붙여 실행.
# ⚠ 인가코드는 1분 만료 — 사람이 직접 연속으로 눌러야 한다.
on:
  workflow_dispatch:
    inputs:
      mall_id:
        description: "카페24 몰 아이디 (어드민 주소 https://<여기>.cafe24.com)"
        required: true
      redirect_uri:
        description: "개발자센터 App 관리 > Redirect URI(s) 와 글자까지 동일"
        required: true
        default: "https://mkroadmaster-spec.github.io/dearmami-ops-status/"

jobs:
  url:
    runs-on: ubuntu-latest
    env:
      CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
    steps:
      - name: URL 생성
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          mall = "${{ github.event.inputs.mall_id }}"
          cid = os.environ["CAFE24_CLIENT_ID"]
          # Actions 로그 마스킹 회피: client_id 첫 글자만 퍼센트 인코딩
          cid_enc = "%" + format(ord(cid[0]), "02X") + cid[1:]
          scope = "mall.read_order,mall.read_customer,mall.read_community,mall.read_product,mall.read_category,mall.read_application,mall.read_analytics"
          q = f"response_type=code&client_id={cid_enc}&state=ops&redirect_uri={urllib.parse.quote('${{ github.event.inputs.redirect_uri }}', safe='')}&scope={scope}"
          url = f"https://{mall}.cafe24api.com/api/v2/oauth/authorize?{q}"
          print("브라우저로 열기 →"); print(url)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## 카페24 승인 링크\n\n아래 링크를 클릭 → 카페24 로그인 → **승인** → 이동된 주소창의 `code=` 뒤 값을 복사해 `cafe24 token fast` 에 붙여넣기 (⚠ 1분 안에)\n\n")
              f.write(f"### 👉 [여기를 클릭해 승인하기]({url})\n\n```\n{url}\n```\n")
          PY
